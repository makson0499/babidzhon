{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Учёт трат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>💰 Учёт личных трат</h1>
    <nav>
      {{if .User}}
        <a href="/expenses">Список трат</a>
        <a href="/expenses/new">Добавить</a>
        <a href="/about">О проекте</a>
        <span class="nav-right">
          <span class="user">{{.User.Email}}</span>
          <form method="POST" action="/logout" class="inline">
            <button type="submit" class="link">Выйти</button>
          </form>
        </span>
      {{else}}
        <a href="/about">О проекте</a>
        <span class="nav-right">
          <a href="/login">Вход</a>
          <a href="/register">Регистрация</a>
        </span>
      {{end}}
    </nav>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer>© Учебный проект на Go</footer>
</body>
</html>
{{end}}
